name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Audit Python dependencies
        # Two advisories are ignored deliberately; both are off EasyShare's code path:
        #   * GHSA-4xgf-cpjx-pc3j (pydantic-settings): symlink escape in
        #     NestedSecretsSettingsSource / secrets_dir, neither of which
        #     EasyShare uses. Fixed in 2.14.2 and held back only by the
        #     exclude-newer cooling-off; drop this ignore once the lock picks
        #     2.14.2 up.
        #   * PYSEC-2026-3552 (cryptography): Bleichenbacher oracle in the
        #     PKCS#7 pkcs7_decrypt_der/pem/smime S/MIME decryption helpers,
        #     which EasyShare never calls. Fixed in 50.0.0 (released
        #     2026-07-31) and held back only by the exclude-newer cooling-off;
        #     drop this ignore once the lock picks 50.0.0 up.
        run: >-
          uvx pip-audit --require-hashes --disable-pip
          -r <(uv export --frozen --no-header --no-emit-project --no-dev)
          --ignore-vuln GHSA-4xgf-cpjx-pc3j
          --ignore-vuln PYSEC-2026-3552

      - name: Lint (ruff)
        run: uv run --no-sync ruff check app tests

      - name: Type check (mypy)
        run: uv run --no-sync mypy app

      - name: Verify migrations are up to date
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
        env:
          EASYSHARE_DATABASE_URL: sqlite:///./ci.db

      - name: Run tests
        run: uv run --no-sync pytest --cov=app --cov-report=term-missing
