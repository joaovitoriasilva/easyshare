name: Create Docker image on new release or using manual trigger

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-arch-images:

    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up QEMU
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release architecture image
        if: ${{ github.event_name == 'release' }}
        run: |
          set -eu
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${{ github.ref_name }}-${{ matrix.arch }}" \
            --push \
            .

      - name: Publish development architecture image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:dev-${{ github.sha }}-${{ matrix.arch }}" \
            --push \
            .

  publish-manifests:

    name: Publish multi-arch manifests
    runs-on: ubuntu-latest
    needs: build-arch-images
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release tag manifest
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_TAG}" \
            "${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${IMAGE_NAME}:${RELEASE_TAG}-arm64"

      - name: Publish major.minor version manifest
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG=$(echo "${RELEASE_TAG}" | sed -n 's/^\(v[0-9]\+\.[0-9]\+\).*/\1/p')
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
              "${IMAGE_NAME}:${RELEASE_TAG}-arm64"
          fi

      - name: Publish latest manifest
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${IMAGE_NAME}:${RELEASE_TAG}-arm64"

      - name: Publish development manifest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEVELOPMENT_TAG: dev-${{ github.sha }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${DEVELOPMENT_TAG}" \
            "${IMAGE_NAME}:${DEVELOPMENT_TAG}-amd64" \
            "${IMAGE_NAME}:${DEVELOPMENT_TAG}-arm64"
